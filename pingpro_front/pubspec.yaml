name: pingpro_front
description: "Ping Pro Frontend"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.0.2
  flutter_svg: ^2.0.7
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  http: ^1.5.0
  fl_chart: ^0.66.2
  model_viewer_plus: ^1.9.3
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/OFL.txt
    - .env
  fonts:
    - family: Anta
      fonts:
        - asset: assets/fonts/Anta-Regular.ttf